version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "Applone"
    assignees:
      - "Applone"
    commit-message:
      prefix: "chore(deps)"
    # These API changes require source migrations. Compatible updates stay enabled.
    ignore:
      - dependency-name: "rubato"
        versions: [">=0.17.0"]
      - dependency-name: "symphonia"
        versions: [">=0.6.0"]
      - dependency-name: "cpal"
        versions: [">=0.18.0"]
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "Applone"
    assignees:
      - "Applone"
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "Applone"
    assignees:
      - "Applone"
    commit-message:
      prefix: "ci(deps)"
